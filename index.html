<html>
<head>
<title>Ngw3na's Snake Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body{
  margin:0; background:aliceblue; color:dimgrey;
  font-family:Arial, sans-serif; text-align:center;
  touch-action:none;
}
h1{ color:darkred; margin:10px; font-size:24px; }
#board{
  background:blue;
  display:block; margin:10px auto;
  border:4px solid #00ff88;
  border-radius:8px;
}
#scoreBox{
  font-size:20px; font-weight:bold; margin:5px;
}
.controls{
  width:200px; margin:15px auto;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}
.btn{
  background:#333; color:grey; border:2px solid brown;
  font-size:26px; padding:15px 5px; border-radius:10px;
  user-select:none;
}
.btn:active{ background:#00ff88; color:black; }
#startBtn{
  background:greenyellow; color:black; border:none;
  padding:12px 30px; font-size:18px; font-weight:bold;
  border-radius:25px; margin-top:10px;
}
</style>
</head>
<body>

<h1>🐍 Kevy GAME 🐍</h1>
<div id="scoreBox">Score: <span id="score">0</span> | High: <span id="high">0</span></div>
<canvas id="board" width="360" height="360"></canvas>
<div id="msg" style="color:blueviolet; height:20px; font-weight:bold;">Tap START</div>

<div class="controls">
  <div></div><div class="btn" ontouchstart="changeDir('up')" onclick="changeDir('up')">↑</div><div></div>
  <div class="btn" ontouchstart="changeDir('left')" onclick="changeDir('left')">←</div>
  <div class="btn" ontouchstart="changeDir('down')" onclick="changeDir('down')">↓</div>
  <div class="btn" ontouchstart="changeDir('right')" onclick="changeDir('right')">→</div>
</div>

<button id="startBtn" onclick="startGame()">START GAME</button>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const gridSize = 20;
const cols = canvas.width / gridSize;
const rows = canvas.height / gridSize;

let snake, food, dir, nextDir, score, highScore, gameLoop, speed;

highScore = localStorage.getItem("snakeHigh") || 0;
document.getElementById("high").innerText = highScore;

function startGame(){
  snake = [{x:9, y:9}];
  dir = "right";
  nextDir = "right";
  score = 0;
  speed = 200; // ONLY CHANGE - REDUCED FROM 120 TO 200 (SLOWER)
  document.getElementById("score").innerText = 0;
  document.getElementById("msg").innerText = "";
  placeFood();
  clearInterval(gameLoop);
  gameLoop = setInterval(update, speed);
}

function placeFood(){
  food = {
    x: Math.floor(Math.random()*cols),
    y: Math.floor(Math.random()*rows)
  };
  for(let s of snake){
    if(s.x===food.x && s.y===food.y){ placeFood(); return; }
  }
}

function update(){
  dir = nextDir;
  let head = {...snake[0]};
  if(dir==="up") head.y--;
  if(dir==="down") head.y++;
  if(dir==="left") head.x--;
  if(dir==="right") head.x++;

  if(head.x<0 || head.x>=cols || head.y<0 || head.y>=rows){
    gameOver(); return;
  }
  for(let s of snake){
    if(s.x===head.x && s.y===head.y){ gameOver(); return; }
  }

  snake.unshift(head);

  if(head.x===food.x && head.y===food.y){
    score+=10;
    document.getElementById("score").innerText = score;
    if(score>highScore){
      highScore=score;
      localStorage.setItem("snakeHigh", highScore);
      document.getElementById("high").innerText = highScore;
    }
    placeFood();
    if(score % 50 === 0){
      clearInterval(gameLoop);
      speed = Math.max(80, speed-10); // changed min speed to 80 to keep it slower
      gameLoop = setInterval(update, speed);
    }
  } else {
    snake.pop();
  }
  draw();
}

function draw(){
  ctx.fillStyle="#222";
  ctx.fillRect(0,0,canvas.width, canvas.height);

  ctx.strokeStyle="#2a2a2a";
  for(let i=0;i<cols;i++){
    ctx.beginPath();
    ctx.moveTo(i*gridSize,0);
    ctx.lineTo(i*gridSize,canvas.height);
    ctx.stroke();
  }

  ctx.fillStyle="purple";
  ctx.beginPath();
  ctx.arc(food.x*gridSize+10, food.y*gridSize+10, 8, 0, Math.PI*2);
  ctx.fill();

  snake.forEach((s, i)=>{
    ctx.fillStyle = i===0 ? "#00ff88" : "#00cc66";
    ctx.fillRect(s.x*gridSize+1, s.y*gridSize+1, gridSize-2, gridSize-2);
    if(i===0){
      ctx.fillStyle="black";
      ctx.fillRect(s.x*gridSize+5, s.y*gridSize+5, 3,3);
      ctx.fillRect(s.x*gridSize+12, s.y*gridSize+5, 3,3);
    }
  });
}

function changeDir(newDir){
  if(dir==="up" && newDir==="down") return;
  if(dir==="down" && newDir==="up") return;
  if(dir==="left" && newDir==="right") return;
  if(dir==="right" && newDir==="left") return;
  nextDir = newDir;
}

function gameOver(){
  clearInterval(gameLoop);
  document.getElementById("msg").innerText="GAME OVER! Tap START";
  ctx.fillStyle="rgba(0,0,0,0.7)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="white";
  ctx.font="30px Arial";
  ctx.fillText("GAME OVER", 90, 180);
}

let sx, sy;
canvas.addEventListener('touchstart', e=>{
  sx=e.touches[0].clientX;
  sy=e.touches[0].clientY;
});
canvas.addEventListener('touchend', e=>{
  if(!sx) return;
  let dx=e.changedTouches[0].clientX-sx;
  let dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>20) changeDir('right'); else if(dx<-20) changeDir('left');
  } else {
    if(dy>20) changeDir('down'); else if(dy<-20) changeDir('up');
  }
  sx=null;
});

draw();
</script>
</body>
</html>
